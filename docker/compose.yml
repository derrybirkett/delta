services:
  delta:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/repo
    working_dir: /repo
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      - GH_TOKEN=${GH_TOKEN:?GH_TOKEN is required}
    command: bash delta/scripts/run-cycle.sh
